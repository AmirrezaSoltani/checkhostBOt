services:
  bot:
    build: .
    container_name: checkhost-bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      MONGO_URI: mongodb://mongo:27017/checkhostbot
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-60}
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-5000}
      PING_TIMEOUT_MS: ${PING_TIMEOUT_MS:-2000}
      TCP_TIMEOUT_MS: ${TCP_TIMEOUT_MS:-3000}
      ADMIN_CHAT_IDS: ${ADMIN_CHAT_IDS:-}
      API_PORT: 3000
      API_TOKEN: ${API_TOKEN:-}
      QUIET_HOURS_TIMEZONE: ${QUIET_HOURS_TIMEZONE:-Europe/Berlin}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"

  mongo:
    image: mongo:7
    container_name: checkhost-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
